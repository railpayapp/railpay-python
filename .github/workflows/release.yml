name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Check the tag matches pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v t="## [${GITHUB_REF_NAME#v}] - " 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "railpay-python $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
